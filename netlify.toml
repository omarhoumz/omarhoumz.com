# https://docs.netlify.com/build/configure-builds/file-based-configuration/
# Node comes from .node-version; pnpm from package.json#packageManager (Corepack).
[build]
  command = "pnpm build"
  publish = "dist"

# Hashed build assets (CSS, fonts, images): safe to cache forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

# Unhashed files from public/ (favicons, icons, OG fallback): a day, then revalidate.
[[headers]]
  for = "/favicons/*"
  [headers.values]
    cache-control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.png"
  [headers.values]
    cache-control = "public, max-age=86400, must-revalidate"

# Old URL. Astro also emits a meta-refresh page at this path (for other hosts);
# force = true makes Netlify send a real 301 even though that file exists.
[[redirects]]
  from = "/writing/firebase-cloud-functions/*"
  to = "/blog/firebase-cloud-functions/"
  status = 301
  force = true
