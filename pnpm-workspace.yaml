# pnpm 12 auto-installs peers and picks @emnapi/runtime 2.0.0-beta.x (allowed by
# @napi-rs/wasm-runtime's peer range) next to @emnapi/core 1.x. The mismatched
# pair crashes `astro check` on exit (bridge.deleteEnv is not a function).
# Remove once @emnapi/core and @emnapi/runtime 2.0 are stable (`npm view @emnapi/runtime dist-tags`).
overrides:
  '@emnapi/runtime': ^1.11.3
  '@emnapi/core': ^1.11.3
  # Security fixes for build-time-only deps (Dependabot alerts):
  # @tailwindcss/typography pins 6.0.10 (quadratic selector parsing, fixed in 6.1.5)
  'postcss-selector-parser': ^6.1.5
  # satori's font parser pulls 0.7.3 (ZIP64 infinite loop, fixed in 0.7.5)
  'fflate': ^0.7.5
