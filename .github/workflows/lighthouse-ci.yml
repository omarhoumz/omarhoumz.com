# Lighthouse audit of each preview deploy, posted as a sticky PR comment.
# The host (Vercel, Netlify) reports previews as GitHub deployments, so this runs on
# deployment_status and skips production environments.
name: Lighthouse

on:
  deployment_status:

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    if: >-
      github.event.deployment_status.state == 'success' &&
      !contains(github.event.deployment.environment, 'Production')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Find PR for this deployment
        id: pr
        uses: actions/github-script@v9
        with:
          script: |
            const { data: prs } = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.payload.deployment.sha,
            })
            const pr = prs.find((p) => p.state === 'open')
            core.setOutput('number', pr ? String(pr.number) : '')

      - name: Audit preview
        id: lighthouse
        if: steps.pr.outputs.number != ''
        uses: treosh/lighthouse-ci-action@12.6.2
        env:
          # No checkout in this job; LHCI otherwise reads the hash via `git rev-parse HEAD`.
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.event.deployment.sha }}
        with:
          urls: |
            ${{ github.event.deployment_status.environment_url }}/
            ${{ github.event.deployment_status.environment_url }}/blog/
            ${{ github.event.deployment_status.environment_url }}/blog/firebase-hosting/
          uploadArtifacts: true
          temporaryPublicStorage: true

      - name: Format results
        id: format
        if: steps.pr.outputs.number != ''
        uses: actions/github-script@v9
        env:
          MANIFEST: ${{ steps.lighthouse.outputs.manifest }}
          LINKS: ${{ steps.lighthouse.outputs.links }}
        with:
          script: |
            const manifest = JSON.parse(process.env.MANIFEST)
            const links = JSON.parse(process.env.LINKS)
            const base = context.payload.deployment_status.environment_url
            const pct = (v) => Math.round(v * 100)
            const dot = (v) => (v >= 90 ? '🟢' : v >= 50 ? '🟠' : '🔴')
            const cell = (v) => `${dot(pct(v))} ${pct(v)}`
            const rows = manifest
              .filter((run) => run.isRepresentativeRun)
              .map(({ url, summary: s }) => {
                const path = url.replace(base, '') || '/'
                return `| [${path}](${links[url]}) | ${cell(s.performance)} | ${cell(s.accessibility)} | ${cell(s['best-practices'])} | ${cell(s.seo)} |`
              })
            core.setOutput('comment', [
              `⚡️ Lighthouse for ${context.payload.deployment.sha.slice(0, 7)} on [preview](${base})`,
              '',
              '| Page | Performance | Accessibility | Best practices | SEO |',
              '| --- | --- | --- | --- | --- |',
              ...rows,
            ].join('\n'))

      - name: Comment on PR
        if: steps.pr.outputs.number != ''
        uses: marocchino/sticky-pull-request-comment@v3
        with:
          number: ${{ steps.pr.outputs.number }}
          header: lighthouse
          message: ${{ steps.format.outputs.comment }}
