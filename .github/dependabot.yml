# https://docs.github.com/code-security/dependabot/working-with-dependabot/dependabot-options-reference
version: 2
updates:
  # pnpm uses the npm ecosystem.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    # Matches pnpm's minimumReleaseAge: don't propose versions younger than a day.
    cooldown:
      default-days: 1
    groups:
      minor-and-patch:
        patterns: ['*']
        update-types: [minor, patch]

  # Keeps workflow actions current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
